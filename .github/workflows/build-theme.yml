name: Build theme

# 源码在 main，构建产物（index.html + assets/）自动发布到 dist 分支。
# 自有仓库 main 成功构建后，通过专用发布接口把生产固定到产物 SHA。
#
# preview 分支同理，产物发到 dist-preview，用来在后台临时切地址验收，
# 不会动到线上用的 dist。
#
# 产物提交的说明就是主题商店里的「更新日志」和版本下拉的标题，格式是
#   v<package.json 的 version> <更新日志>
# 更新日志默认取本次源码提交的标题；手动触发时可以在 changelog 里另写一句。
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
    inputs:
      changelog:
        description: "更新日志（留空则用最近一次源码提交的标题）"
        required: false
        type: string
      force:
        description: "产物没变化也发布一版（只想改更新日志时用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 发布与生产切换串行完成；新的源码由发布前和服务端检查拒绝旧任务。
# main 与 preview 各自排队，互不打断。
concurrency:
  group: build-theme-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'AceDylan/CFSM-SAO' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      artifact_sha: ${{ steps.publish.outputs.artifact_sha }}
      stale: ${{ steps.publish.outputs.stale }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # The temporary checkout credential also authenticates the publication worktree.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # 版本号来自 package.json，发布新版本前记得 npm version / 手改一下。
      - name: Compose release note
        id: note
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          # 优先级：手动填的 changelog > CHANGELOG.md 里对应版本的第一行 > 源码提交标题。
          note="${CHANGELOG:-}"
          if [ -z "${note}" ] && [ -f CHANGELOG.md ]; then
            note="$(awk -v want="## ${version}" '
              $0 == want { found = 1; next }
              found && /^## / { exit }
              found && NF { print; exit }
            ' CHANGELOG.md)"
          fi
          [ -n "${note}" ] || note="$(git log -1 --pretty=%s)"
          {
            echo "message<<RELEASE_NOTE_EOF"
            echo "${version} ${note}"
            echo
            echo "build: ${GITHUB_SHA::7}"
            echo "RELEASE_NOTE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "本次产物说明：${version} ${note}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate artifact and write release manifest
        run: node scripts/prepare-release.mjs

      - name: Release protocol tests
        run: node --test --test-concurrency=1 scripts/release.test.mjs

      # Keep artifact history with fast-forward commits; no credentials in remote URLs.
      - name: Publish build
        id: publish
        env:
          RELEASE_NOTE: ${{ steps.note.outputs.message }}
          FORCE_PUBLISH: ${{ inputs.force }}
        run: node scripts/publish-release.mjs

  promote:
    needs: build
    if: github.repository == 'AceDylan/CFSM-SAO' && github.ref == 'refs/heads/main' && needs.build.outputs.stale == 'false' && needs.build.outputs.artifact_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Promote validated immutable production artifact
        env:
          # This credential can only promote/recover AceDylan/CFSM-SAO themes.
          # Never place Worker, Cloudflare, Agent or administrator credentials here.
          THEME_PUBLISH_TOKEN: ${{ secrets.THEME_PUBLISH_TOKEN }}
          # Ephemeral read-only token, forwarded only to exact GitHub validation GETs.
          GH_READ_TOKEN: ${{ github.token }}
          ARTIFACT_SHA: ${{ needs.build.outputs.artifact_sha }}
        run: node scripts/promote-release.mjs
